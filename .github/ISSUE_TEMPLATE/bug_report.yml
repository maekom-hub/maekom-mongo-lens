name: Bug Report
description: Report a bug or compatibility issue in Maekom Mongo Lens
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    id: warning
    attributes:
      value: |
        > **Security Notice:** Please **mask or remove** all MongoDB/DocumentDB URIs, passwords, AES keys, and TLS certificates before submitting this report.

  - type: dropdown
    id: db_engine
    attributes:
      label: Target Database Engine
      description: Which database engine were you connected to?
      options:
        - MongoDB (Standalone / Replica Set)
        - MongoDB Atlas (mongodb+srv)
        - AWS DocumentDB 5.0
        - AWS DocumentDB 4.0
        - AWS DocumentDB 3.6
        - Other
    validations:
      required: true

  - type: textarea
    id: versions
    attributes:
      label: Environment Versions
      description: Please provide plugin, IDE, and OS versions.
      placeholder: |
        - Maekom Mongo Lens: v0.2.7
        - IntelliJ IDEA: 2024.2.x (Community / Ultimate)
        - OS / JBR: macOS / Windows / Linux (JDK 21)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description & Steps to Reproduce
      description: Describe what happened, what you expected, and how to reproduce the issue.
      placeholder: |
        1. Connect to ...
        2. Click / Execute ...
        3. Observed error ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Error Output
      description: Paste any sanitized stack traces or MongoDB error messages (no credentials).
      render: shell
    validations:
      required: false
